name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-unit:
    name: pytest unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        # TODO(01-03 deviation): coverage gate is currently broken — actual
        # coverage post-v1-deletion (commit a9c2032) sits at ~30% because the
        # deleted tests covered surviving code paths (paths.py, voronoi.py,
        # ingest_*). Both the planned 85% bump (must_haves) and the existing
        # 60% gate fail. Bump deferred to a follow-up coverage-restoration
        # plan; see .planning/phases/01-pipeline-parity-port-harness-together/
        # 01-03-SUMMARY.md for rationale and recommended next step.
        run: pytest backend/tests/unit/ -v --cov=medieval_forge --cov-fail-under=60

  pytest-parity:
    name: pytest parity + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run parity + integration tests
        # Non-skippable from Phase 01. Any parity-test failure blocks merge.
        run: pytest backend/tests/parity/ backend/tests/integration/ -v -m "parity or integration" --no-header

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run

  playwright-uat:
    name: playwright UAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run e2e:playwright
        # Phase 00: smoke test scaffold may not exist yet — script returns 0 if no tests configured.
